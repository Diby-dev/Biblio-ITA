<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu visiteurs</title>
    <style>
        :root {
            --sidebar-width: 250px;
        }

        body {
            font-family: 'Inter', Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .slideshow-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-color: var(--dark-blue);
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 3.2s ease-in-out;
            filter: brightness(0.9) blur(1px);
            z-index: 1;
        }

        .logo-accueil{
            width: 220px;
            height: 180px;
            top: 70px;
            left: 370px;
            position: relative;

        }

        .slide.active {
            opacity: 1;
            z-index: 2;
        }
        
        .slide:nth-child(1) { 
            background-image: url('./assets/imgvi3.jpg'); 
        }
        .slide:nth-child(2) { 
            background-image: url('./assets/imgvi2.jpg'); 
        }
        .slide:nth-child(3) { 
            background-image: url('./assets/imgvi.jpg'); 
        }

        .sidebar {
            width: var(--sidebar-width);
            min-width: var(--sidebar-width);
            background-color: rgb(110, 40, 13);
            color: white;
            padding: 20px 0;
            box-shadow: 5px 0 15px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            z-index: 10;
        }
        
        h1 {
            display: none;
        }

        .menu-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .menu-group {
            width: 100%;
            margin-bottom: 15px;
        }
        
        .menu-group-header {
            font-size: 0.8rem;
            color: #ffffffcc;
            padding: 8px 20px 5px 20px;
            text-transform: uppercase;
            font-weight: bold;
            font-size: 20px;
            text-align: center;
        }

        .menu-buttonvi {
            width: 100%;
            padding: 12px 20px;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            background-color: transparent;
            color: white;
            text-align: left;
            transition: background-color 0.2s, padding-left 0.2s;
            border-radius: 0; 
            display: flex;
            align-items: center;
        }
        
        .menu-buttonvi i {
            margin-right: 10px;
            width: 50px; 
            text-align: center;
        }

        .menu-buttonvi:hover {
            background-color: #34495e; 
            padding-left: 25px;
        }

        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.9);
            z-index: 5;
            padding: 20px;
        }
       
        .iconebou2{
            position: absolute;
            left: 35px;
            top: 141px;
            width: 36px;
            height: 36px;
        }
        .iconebou3{
            position: absolute;
            left: 35px;
            top: 183px;
            width: 36px;
            height: 36px;
        }
      
        
        .welcome-text {
            font-size: 4.5rem;
            font-weight: bold;
            letter-spacing: 5px;
            text-transform: uppercase;
            animation: fadeIn 3s ease-in-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
    </style>
</head>
<body>
    <div class="slideshow-container">
        <div class="slide active"></div>
        <div class="slide"></div>
        <div class="slide"></div>
    </div>
     
    <div class="sidebar">
        <div class="menu-group-header">VISITE DE LA BIBLIOTHÈQUE</div> 
   
        <div class="menu-group">
            <div class="menu-group-header">que voulez vous vérifier ?</div>
            <img src="./assets/livre.png" alt="Logo de la Bibliothèque" class="iconebou2">
            <img src="./assets/auteur.png" alt="Logo de la Bibliothèque" class="iconebou3">
            <div class="menu-container">
                
                
                <button id="btn-livre" class="menu-buttonvi" data-target="voir_livrevis.html">
                    <i></i> Livre
                </button>
                <button id="btn-auteur" class="menu-buttonvi" data-target="voir_auteurvis.html">
                    <i></i> Auteur
                </button>
                    </div>
        </div>

        <div class="menu-group">
            <div class="menu-group-header"></div>
            <div class="menu-container">
                <button id="btn-rapport-pdf" class="menu-buttonvi" data-target="rapport_pdf.html">
                    <i></i>
                </button>
            </div>
        </div>
    </div>
   
     <img src="./assets/ITA.png" alt="Logo de la Bibliothèque" class="logo-accueil">
    <div class="main-content">
    <div class="welcome-text">BIENVENUE</div>
</div>
   
    <script src="renderervis.js"></script>
</body>
</html>
