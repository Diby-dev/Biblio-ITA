<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion</title>
    <style>
        .video-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .login-box {
            background: rgba(231, 255, 233, 0.9);
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            width: 350px;
            text-align: center;
            border-top: 5px solid #3498db;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center; /* Centre les éléments horizontalement dans la boîte */
        }

        /* Style du logo intégré dans la boîte */
        .logo-accueil {
            width: 100px;
            height: 90px;
            object-fit: contain;
            margin-bottom: 10px; /* Espace entre le logo et le titre CONNEXION */
        }

        .login-box h2 {
            color: #2c3e50;
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 1.6em;
            font-weight: 600;
        }

        /* Pour que le formulaire prenne toute la largeur de la boîte */
        #login-form {
            width: 100%;
        }

        .login-box label {
            display: block;
            text-align: left;
            margin-bottom: 8px;
            font-weight: bold;
            color: #34495e;
            font-size: 0.95em;
        }

        .login-box input[type="text"], .login-box input[type="password"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #bdc3c7;
            border-radius: 6px;
            box-sizing: border-box; 
            font-size: 1em;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .login-box input[type="text"]:focus, .login-box input[type="password"]:focus {
            border-color: #3498db;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.5);
            outline: none;
        }

        .login-box .butad {
            background-color: #3498db;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 1.05em;
            font-weight: 600;
            transition: background-color 0.3s ease;
        }

        .login-box .butvi {
            margin-top: 10px;
            background-color: #4d34db;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 1.05em;
            font-weight: 600;
            transition: background-color 0.3s ease;
        }

        .login-box button:hover {
            opacity: 0.9;
        }

        #message {
            margin-top: 15px;
            font-size: 0.9em;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <video autoplay muted loop class="video-bg">
        <source src="./assets/fond3.mp4" type="video/mp4">
        Votre navigateur ne supporte pas la lecture de vidéos.
    </video>

    <div class="login-box">
        <!-- Le logo est maintenant placé ici, tout en haut du bloc -->
        <img src="./assets/ITA.png" alt="Logo de la Bibliothèque" class="logo-accueil">
        
        <h2>CONNEXION</h2>
        
        <form id="login-form">
            <label for="nom-admin">Nom d'utilisateur administrateur :</label>
            <input type="text" id="nom-admin" placeholder="Votre nom administrateur" required autocomplete="username">
            
            <label for="password">Mot de passe :</label>
            <input type="password" id="password" placeholder="Votre mot de passe" required autocomplete="current-password">
            
            <button type="submit" class="butad">Se connecter à l'espace de gestion</button>
            <button type="button" id="btn-acces-visiteur" class="butvi">Accès visiteur</button>
            
            <div id="message"></div>
        </form>
    </div>

    <script src="login-renderer.js"></script>
</body>
</html>
